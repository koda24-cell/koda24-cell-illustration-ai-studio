# テンプレート: 線画の生成。<...> を置換し、model を許可済みIDにしてから jobs/ にコピーして使う
job_id: tpl-lineart
title: 線画の生成
backend: diffusers
time_budget_minutes: 90
publish: true
assign_to:
  project: ''
  targets: []
limits:
  max_rounds: 5
  candidates_per_round: 3
  patience: 2
  target_score: 0.8
defaults:
  model: auto
  purpose:
  - anime
  - character
  loras: []
  width: 512
  height: 768
  steps: 24
  cfg: 7
  scheduler: euler_a
  negative_prompt: lowres, bad anatomy, bad hands
evaluation:
  references: []
  metrics:
  - color
  - value_saturation
  - lineart
  - shading
  - composition
  - similarity
  - artifacts
  - consistency
improve:
  enabled: true
  tune:
  - cfg
  - steps
  - denoise
  - prompt
recipe:
  type: lineart
  prompt: 1girl, <キャラの特徴>
