# モデルを使わない総合動作確認（procedural バックエンド = テスト専用の模様画像）
job_id: selftest-procedural
title: 自己診断（モデル不使用）
backend: procedural
time_budget_minutes: 5
publish: true
limits: {max_rounds: 3, candidates_per_round: 2, patience: 2, target_score: 1.01}
defaults: {width: 128, height: 128, steps: 12, cfg: 7, negative_prompt: ""}
evaluation:
  metrics: [composition, artifacts, consistency, pose]
stages:
  - {name: base, op: txt2img, prompt: "test pattern, outline"}
  - {name: variant, op: inpaint, init: "stage:base", mask: {rect: [0.25, 0.25, 0.5, 0.5]}, prompt: "test pattern, vibrant", denoise: 0.6, consistency_base: "stage:base"}
  - {name: wider, op: outpaint, init: "stage:base", outpaint: {left: 32, right: 32}, prompt: "test pattern"}
  - {name: hires, op: hires_upscale, init: "stage:base", scale: 1.5, denoise: 0.3, prompt: "test pattern"}
  - {name: cutout, op: remove_bg, init: "stage:base"}
  - {name: lineart, op: lineart_extract, init: "stage:base"}
  - {name: big, op: upscale, init: "stage:base", scale: 2}
  - {name: bg, op: txt2img, prompt: "test background, bright"}
  - {name: composite, op: replace_bg, init: "stage:cutout", background: "stage:bg", fg_scale: 0.8}
