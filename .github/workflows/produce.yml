name: produce
# 制作の手動起動（共通 Docker イメージで実行）。制作指示 YAML を指定するだけで動く。
# 時間切れ時は studio-run が自動でこのワークフローを resume_run_id 付きで再起動して引き継ぐ。
on:
  workflow_dispatch:
    inputs:
      job:
        description: "制作指示YAMLのパス（例: jobs/queue/my-job.yaml）"
        required: false
        default: jobs/examples/selftest-procedural.yaml
      resume_run_id:
        description: "再開するrun_id（空なら新規）"
        required: false
        default: ""
      time_budget:
        description: "このジョブの時間予算（分, 最大345。空ならYAMLの値）"
        required: false
        default: ""
      chain_depth:
        description: "自動引き継ぎの段数（通常は0のまま）"
        required: false
        default: "0"

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  run:
    uses: ./.github/workflows/studio-run.yml
    with:
      job: ${{ inputs.job }}
      resume_run_id: ${{ inputs.resume_run_id }}
      time_budget: ${{ inputs.time_budget }}
      chain_depth: ${{ inputs.chain_depth }}
    secrets: inherit
