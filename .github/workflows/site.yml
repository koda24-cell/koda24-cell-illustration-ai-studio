name: site
# 制作確認サイトを studio-runs ブランチの全履歴から生成し GitHub Pages に公開。
# 非公開入力の派生物・非公開参考画像は掲載しない（studio/site.py）。
on:
  push:
    branches: [main, studio-runs]
  workflow_run:
    workflows: [produce]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: pip install -r requirements/base.txt
      - name: Fetch studio-runs (if exists)
        run: |
          if git ls-remote --exit-code --heads origin studio-runs >/dev/null; then
            git clone -q --depth 1 --branch studio-runs "https://github.com/${{ github.repository }}.git" runs-branch
          else
            mkdir -p runs-branch/runs
          fi
      - run: python -m studio site --runs-dir runs-branch/runs --out _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
